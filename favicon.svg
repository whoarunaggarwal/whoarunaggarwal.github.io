<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Outer Circuit Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.5"/>

  <!-- Industrial Monogram / Logic Gate 'A' -->
  <path d="M 32 14 L 46 48 L 39 48 L 34.5 37 L 29.5 37 L 25 48 L 18 48 Z M 32 24 L 30.5 32 L 33.5 32 Z" 
        fill="url(#cyanGrad)" filter="url(#glow)"/>
        
  <!-- Logic Status Indicators -->
  <circle cx="16" cy="16" r="3" fill="#10b981"/>
  <circle cx="48" cy="16" r="3" fill="#f59e0b"/>
  <circle cx="32" cy="52" r="2.5" fill="#00f0ff"/>
</svg>